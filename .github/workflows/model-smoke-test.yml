name: Model smoke test

# Hits the deployed inference /predict endpoint with a fixed payload after
# changes land on main, and asserts the response shape. Catches the class of
# bug where unit tests pass but the deployed model endpoint is broken
# (cold-start timeouts, missing model artifact, IAM regression, etc.).
#
# Required repo secrets:
#   GCP_WIF_PROVIDER       — Workload Identity Federation provider resource name
#   GCP_SMOKE_TEST_SA      — service account email with roles/run.invoker on the
#                            inference Cloud Run service
#   INFERENCE_URL          — full https URL of the deployed inference service
#                            (e.g. https://distilbert-priority-inference-xxx.a.run.app)
#
# If any secret is unset the job exits early with a clear message rather than
# failing — keeps the workflow useful even before secrets are wired up.

on:
  push:
    branches: [main]
    paths:
      - 'inference/**'
  workflow_dispatch:
  schedule:
    # Daily at 15:00 UTC — catches drift / silent regressions even with no deploys
    - cron: '0 15 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for WIF
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        id: secrets
        env:
          WIF: ${{ secrets.GCP_WIF_PROVIDER }}
          SA: ${{ secrets.GCP_SMOKE_TEST_SA }}
          URL: ${{ secrets.INFERENCE_URL }}
        run: |
          if [[ -z "$WIF" || -z "$SA" || -z "$URL" ]]; then
            echo "::warning::One or more required secrets are unset; skipping smoke test."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP and mint ID token
        id: auth
        if: steps.secrets.outputs.skip == 'false'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SMOKE_TEST_SA }}
          token_format: id_token
          id_token_audience: ${{ secrets.INFERENCE_URL }}
          id_token_include_email: true

      - name: Warm up endpoint, then hit /predict and assert response shape
        if: steps.secrets.outputs.skip == 'false'
        env:
          INFERENCE_URL: ${{ secrets.INFERENCE_URL }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail

          AUTH=(-H "Authorization: Bearer $ID_TOKEN")

          # The service runs at min-instances=0, so a daily cron run always
          # hits a cold start: container boot + heavy ML imports + model load
          # take ~70s end-to-end. A single 60s request can't outlast that, so
          # we first poll /health (which returns 200 only once the model is
          # loaded) with a generous per-request budget and retries. This
          # absorbs the cold start; the /predict assertion below then runs
          # against a warm instance and returns in ~1s. We still surface a hard
          # failure if the endpoint never becomes healthy.
          echo "Warming up $INFERENCE_URL (cold start can take ~70s)..."
          warm=false
          for attempt in $(seq 1 6); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "${AUTH[@]}" --max-time 90 "$INFERENCE_URL/health" || echo "000")
            echo "  attempt $attempt: /health -> $code"
            if [[ "$code" == "200" ]]; then
              warm=true
              break
            fi
            sleep 5
          done
          if [[ "$warm" != "true" ]]; then
            echo "::error::endpoint did not become healthy after warm-up attempts"
            exit 1
          fi

          # Endpoint is warm now; this should respond in ~1s.
          PAYLOAD='{"ticket_text":"Customer cannot complete checkout due to payment timeout."}'
          BODY=$(curl -sS --fail-with-body \
            "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 30 \
            "$INFERENCE_URL/predict")

          echo "Response: $BODY"
          # Assert predicted_priority field is present and non-empty.
          echo "$BODY" | python -c '
          import json, sys
          r = json.load(sys.stdin)
          p = r.get("predicted_priority")
          assert isinstance(p, str) and p, f"predicted_priority missing or empty: {r}"
          print(f"ok: predicted_priority={p!r}")
          '
